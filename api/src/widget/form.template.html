<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skjema</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; color: #222; background: transparent; }
    .title { margin: 0 0 12px; font-size: 16px; font-weight: 600; }
    .field { margin-bottom: 12px; }
    .label { display: block; margin-bottom: 4px; font-size: 14px; }
    .required { color: #b3261e; }
    .field input[type="text"], .field input[type="number"], .field input[type="date"], .field select { display: block; width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 8px; border: 1px solid #999; background: transparent; color: inherit; font: inherit; }
    .field input[type="checkbox"] { width: 20px; height: 20px; }
    .help { margin: 4px 0 0; font-size: 13px; color: #666; }
    .send { padding: 10px 20px; border-radius: 8px; border: 0; background: #5b3df5; color: #fff; font: inherit; cursor: pointer; }
    .send[disabled] { opacity: 0.5; cursor: default; }
    input[disabled], select[disabled] { opacity: 0.6; }
    @media (prefers-color-scheme: dark) {
      body { color: #eee; }
      .help { color: #bbb; }
      .required { color: #f2b8b5; }
      .field input[type="text"], .field input[type="number"], .field input[type="date"], .field select { border-color: #777; }
      .send { background: #7a63ff; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Each inlined bundle gets its own module scope; module scripts run in order. -->
  <script type="module">/*__BUNDLE__*/</script>
  <script type="module">/*__LOGIC__*/</script>
  <script type="module">
    const { App } = globalThis.__mcpApps;
    const { renderForm } = globalThis.__widget;
    const app = new App({ name: "Fiken form", version: "1.0.0" });
    const root = document.getElementById("root");
    const syncSize = () => app.sendSizeChanged({ height: document.body.scrollHeight }).catch(() => {});
    // Once sent, a repeated tool result must not re-render and re-enable the form.
    let answered = false;
    app.ontoolresult = (params) => {
      if (answered) return;
      const sc = params.structuredContent;
      if (!sc?.title || !Array.isArray(sc.fields)) return;
      root.replaceChildren();
      renderForm(document, root, sc, (text) => {
        answered = true;
        app.sendMessage({ role: "user", content: [{ type: "text", text }] }).catch((e) => console.error("sendMessage failed", e));
      });
      syncSize();
    };
    await app.connect();
  </script>
</body>
</html>
